<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What's your name? — Arfus 🎮</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <nav class="navbar simple">
    <a href="index.html" class="logo" aria-label="Arfus home">
      <span class="logo-mark" aria-hidden="true">🎮</span>
      <span class="logo-word">Arfus</span>
    </a>
    <div class="nav-right">
      <button id="themeToggle" class="icon-btn" title="Day / night mode" aria-label="Toggle color theme"></button>
    </div>
  </nav>

  <main class="auth-wrap">
    <div class="auth-card bounce-in">
      <div class="mascot wiggle" aria-hidden="true">🎮</div>
      <h1>What's your name? 😊</h1>
      <p class="muted">Just tell us your name and jump right in —<br />no email needed! 🎉</p>

      <div id="formError" class="error-box hidden"></div>

      <form id="nameForm" novalidate>
        <label>Your name
          <input id="playerName" type="text" maxlength="30" autocomplete="off" placeholder="Pick a cool name 😎" required />
        </label>
        <button type="submit" id="submitBtn" class="btn btn-primary btn-big">Let's play! 🚀</button>
      </form>
    </div>
  </main>

  <footer class="footer">Made with 💖 for curious minds · Arfus</footer>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
