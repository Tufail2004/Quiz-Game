<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join free — QuizGame 🎉</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo" aria-label="QuizGame home">
      <span class="logo-mark" aria-hidden="true">🎮</span>
      <span class="logo-word">QuizGame</span>
    </a>
    <div class="nav-right">
      <button id="themeToggle" class="icon-btn" title="Day / night mode" aria-label="Toggle color theme"></button>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card tape">
      <span class="mascot" aria-hidden="true">🎉</span>
      <h1>Join the fun!</h1>
      <p class="sub">Create your free account and start playing in seconds! ⭐</p>
      <div id="formError" class="error-box hidden"></div>
      <form id="registerForm" novalidate>
        <label>Your name
          <input type="text" id="name" required placeholder="Pick a cool name 😎" autocomplete="name" />
        </label>
        <label>Email
          <input type="email" id="email" required placeholder="you@example.com" autocomplete="email" />
        </label>
        <label>Password
          <input type="password" id="password" required minlength="6" placeholder="At least 6 characters 🔒" autocomplete="new-password" />
        </label>
        <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%">Create my account! 🎮</button>
      </form>
      <p class="auth-alt">Already playing? <a href="login.html">Log in 👋</a></p>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
