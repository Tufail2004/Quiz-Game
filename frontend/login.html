<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — QuizGame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo" aria-label="QuizGame home">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <circle cx="12" cy="12" r="8" />
          <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none" />
        </svg>
      </span>
      <span class="logo-word">QuizGame</span>
    </a>
    <div class="nav-right">
      <button id="themeToggle" class="icon-btn" title="Toggle light/dark mode" aria-label="Toggle color theme"></button>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card fade-in">
      <h2>Welcome back</h2>
      <p class="auth-sub">Log in to continue your quiz streak.</p>

      <div id="formError" class="error-box hidden"></div>

      <form id="loginForm" novalidate>
        <label>
          Email
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
        </label>
        <label>
          Password
          <input type="password" id="password" placeholder="Your password" required autocomplete="current-password" />
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Log in</button>
      </form>

      <p class="auth-switch">
        New here? <a href="register.html">Create an account</a>
      </p>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
