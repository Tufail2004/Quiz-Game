<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard — QuizGame</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <a href="dashboard.html" class="logo">🎯 QuizGame</a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="leaderboard.html" class="active">Leaderboard</a>
      <a href="history.html">History</a>
      <a href="admin.html" id="adminLink" class="hidden">Admin</a>
    </div>
    <div class="nav-right">
      <button id="themeToggle" class="icon-btn" title="Toggle light/dark mode">🌙</button>
      <span id="navUserName" class="nav-user"></span>
      <button id="logoutBtn" class="btn btn-small">Logout</button>
    </div>
  </nav>

  <main class="container">
    <h1 class="fade-in">🏆 Global Leaderboard</h1>
    <p class="muted">Top 20 scores of all time, across all players.</p>

    <div class="card table-wrap fade-in">
      <table class="table" id="leaderboardTable">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Score</th>
            <th>Accuracy</th>
            <th>Category</th>
            <th>Difficulty</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
          <tr><td colspan="7" class="center muted">Loading… ⏳</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/leaderboard.js"></script>
</body>
</html>
